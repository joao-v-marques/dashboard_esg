<!doctype html>
<!--
  Dashboard.

  Tela de acompanhamento dos indicadores. Convive com a Início: lá ficam a
  saudação e a apresentação do que a aplicação faz; aqui fica a análise.

  A área de conteúdo é montada por JavaScript, e este arquivo é de propósito
  quase vazio: os blocos de setor nascem de uma configuração
  (js/pages/dashboard_sectors.js), não de HTML escrito à mão. Setor novo —
  Energia, Recursos Hídricos, Emissões, Governança — entra naquela lista e
  vira uma aba sozinho, sem que este template mude uma linha.

  Cada setor tem o próprio filtro de período e o próprio ciclo de
  carregamento/erro, consumindo o próprio endpoint (ver a conversa sobre um
  dashboard controller por domínio, não um só para todos). Não há filtro
  global. Um domínio fora do ar não trava os outros.

  Como nas demais telas, o HTML é puro — o Flask só entrega com
  render_template. Topbar e sidebar não são repetidas aqui; [data-topbar] e
  [data-sidebar] nascem vazios e são preenchidos por js/pages/shell.js, que é o
  único lugar onde o shell existe.
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Dashboard · Acompanhamento ESG</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">

    <!-- A ordem abaixo é a cascata do projeto e não muda: tokens definem os
         valores, base reseta e cria os utilitários, components traz os blocos
         reutilizáveis e o CSS da página só arranja esses blocos na tela. -->
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/notyf.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>

<body>
<!-- Primeiro tabstop de toda página do app. Fica no HTML, e não no shell em JS,
     justamente para ser o primeiro tabstop desde o primeiro instante. -->
<a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

<div class="app" data-app>

    <!-- PREENCHIDO VIA JS (js/pages/shell.js) -->
    <header class="topbar" data-topbar></header>

    <div class="app__body">

        <!-- PREENCHIDO VIA JS (js/pages/shell.js) -->
        <aside class="sidebar on-inverse" id="sidebar" data-sidebar></aside>

        <!-- Fundo escuro do menu em overlay (mobile) -->
        <div class="sidebar-scrim" data-sidebar-scrim hidden></div>

        <main class="app__main" id="conteudo">
            <div class="container stack-32">

                <!-- Sem cabeçalho visível de propósito — a tela prioriza os
                     indicadores, sem repetir "Dashboard" que já está no título
                     da aba e no item ativo da sidebar. O <h1> continua no DOM,
                     só para quem usa leitor de tela: toda página precisa de um,
                     visível ou não. -->
                <h1 class="visually-hidden">Dashboard</h1>

                <!-- =====================================================
                     Barra do painel: a faixa de abas e as ações do painel na
                     mesma linha.

                     As abas são escritas por js/pages/dashboard.js a partir da
                     lista de setores, mas o role e o rótulo ficam aqui: valem
                     para a faixa mesmo no instante em que ela ainda está vazia.

                     "Exportar" gera um CSV do que está na tela, com os
                     períodos escolhidos em cada setor.
                     ===================================================== -->
                <div class="dash-bar">
                    <!-- PREENCHIDO VIA JS (js/pages/dashboard.js) -->
                    <div class="tabs" role="tablist" aria-label="Setores de indicadores"
                         data-dashboard-tabs></div>

                    <div class="dash-bar__actions">
                        <button class="btn btn--secondary" type="button" data-export>
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                                <path d="M10 3v9m0 0 3.5-3.5M10 12 6.5 8.5" stroke="currentColor"
                                      stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M4 13.5V15a1.5 1.5 0 0 0 1.5 1.5h9A1.5 1.5 0 0 0 16 15v-1.5"
                                      stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            </svg>
                            Exportar
                        </button>
                    </div>
                </div>

                <!-- PREENCHIDO VIA JS (js/pages/dashboard.js) -->
                <div data-dashboard-body></div>

            </div>
        </main>
    </div>
</div>

<!-- Shell (topbar, sidebar, menu da conta e usuário logado), comum a todas as
     telas. Vem antes do script da página, sempre. -->
<script type="module" src="/static/js/pages/shell.js"></script>
<script type="module" src="/static/js/pages/dashboard.js"></script>
</body>
</html>
