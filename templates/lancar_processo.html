<!doctype html>
<!--
  Cadastrar Processo.

  Cadastro de um processo judicial para acompanhamento processual. Como em
  "Lançar NIP", o formulário é a página inteira, e não um modal: são nove
  campos, e a tela só cadastra — consultar e editar fica para a próxima tela
  do grupo, quando existir.

  Como nas demais telas, o HTML é puro e o shell (topbar, sidebar) nasce vazio
  em [data-topbar]/[data-sidebar], preenchido por js/pages/shell.js.

  novalidate no <form> pelo mesmo motivo do login e das demais telas: a
  validação é escrita em js/pages/lancar_processo.js, que preenche
  .field__error e marca aria-invalid, em vez das bolhas nativas do navegador.
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Cadastrar Processo · Acompanhamento ESG</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">

    <!-- A ordem abaixo é a cascata do projeto e não muda: tokens definem os
         valores, base reseta e cria os utilitários, components traz os blocos
         reutilizáveis e o CSS da página só arranja esses blocos na tela. -->
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/notyf.css">
    <link rel="stylesheet" href="/static/css/lawsuits.css">
</head>

<body>
<!-- Primeiro tabstop de toda página do app. Fica no HTML, e não no shell em JS,
     justamente para ser o primeiro tabstop desde o primeiro instante. -->
<a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

<div class="app" data-app>

    <!-- PREENCHIDO VIA JS (js/pages/shell.js) -->
    <header class="topbar" data-topbar></header>

    <div class="app__body">

        <!-- PREENCHIDO VIA JS (js/pages/shell.js) -->
        <aside class="sidebar on-inverse" id="sidebar" data-sidebar></aside>

        <!-- Fundo escuro do menu em overlay (mobile) -->
        <div class="sidebar-scrim" data-sidebar-scrim hidden></div>

        <main class="app__main" id="conteudo">
            <div class="container stack-32">

                <!-- =====================================================
                     1. Cabeçalho da página
                     ===================================================== -->
                <header class="page-head">
                    <div class="page-head__text">
                        <h1 class="page-head__title">Cadastrar Processo</h1>
                        <p class="page-head__subtitle">
                            Registre um processo judicial para acompanhamento
                            processual.
                        </p>
                    </div>
                </header>

                <!-- =====================================================
                     2. Formulário

                     O <form> envolve o card inteiro para que o botão do
                     rodapé seja um submit de verdade — Enter em qualquer
                     campo envia, sem depender de JS para isso.

                     Os campos nascem desabilitados via fieldset: os quatro
                     selects de apoio só têm opção depois que as respectivas
                     APIs respondem, e um formulário editável com seletor
                     vazio convida a pessoa a preencher tudo para travar no
                     fim.
                     ===================================================== -->
                <form data-lawsuit-form novalidate>
                    <div class="card">
                        <div class="card__header">
                            <h2 class="card__title">Dados do processo</h2>
                        </div>

                        <fieldset class="lawsuit-fields card__body stack-32" data-lawsuit-form-fields disabled>
                            <legend class="visually-hidden">Dados do processo</legend>

                            <!-- Identificação ---------------------------- -->
                            <div class="fieldset" role="group" aria-labelledby="secao-identificacao">
                                <p class="fieldset__legend" id="secao-identificacao">Identificação</p>
                                <div class="fieldset__body">
                                    <div class="field-row">
                                        <div class="field">
                                            <label class="field__label" for="lawsuit-case-number">Número do processo</label>
                                            <input class="input tabular" type="text" id="lawsuit-case-number"
                                                   name="case_number" inputmode="numeric" maxlength="25"
                                                   placeholder="0000000-00.0000.0.00.0000" autocomplete="off" required
                                                   data-case-number-input
                                                   aria-describedby="erro-lawsuit-case-number dica-lawsuit-case-number">
                                            <p class="field__hint" id="dica-lawsuit-case-number">Padrão 0000000-00.0000.0.00.0000. Único por processo.</p>
                                            <p class="field__error" id="erro-lawsuit-case-number"
                                               data-error-for="lawsuit-case-number" hidden></p>
                                        </div>

                                        <div class="field">
                                            <label class="field__label" for="lawsuit-date">Data do processo</label>
                                            <input class="input" type="date" id="lawsuit-date"
                                                   name="lawsuit_date" required
                                                   aria-describedby="erro-lawsuit-date">
                                            <p class="field__error" id="erro-lawsuit-date"
                                               data-error-for="lawsuit-date" hidden></p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Partes ------------------------------------ -->
                            <div class="fieldset" role="group" aria-labelledby="secao-partes">
                                <p class="fieldset__legend" id="secao-partes">Partes</p>
                                <div class="fieldset__body">
                                    <div class="field-row">
                                        <div class="field">
                                            <label class="field__label" for="lawsuit-plaintiff">Autor (Requerente)</label>
                                            <input class="input" type="text" id="lawsuit-plaintiff"
                                                   name="plaintiff" maxlength="255" autocomplete="off" required
                                                   aria-describedby="erro-lawsuit-plaintiff">
                                            <p class="field__error" id="erro-lawsuit-plaintiff"
                                               data-error-for="lawsuit-plaintiff" hidden></p>
                                        </div>

                                        <div class="field">
                                            <label class="field__label" for="lawsuit-defendant">Réu (Requerido)</label>
                                            <input class="input" type="text" id="lawsuit-defendant"
                                                   name="defendant" maxlength="255" autocomplete="off" required
                                                   aria-describedby="erro-lawsuit-defendant">
                                            <p class="field__error" id="erro-lawsuit-defendant"
                                               data-error-for="lawsuit-defendant" hidden></p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Classificação ---------------------------- -->
                            <div class="fieldset" role="group" aria-labelledby="secao-classificacao">
                                <p class="fieldset__legend" id="secao-classificacao">Classificação</p>
                                <div class="fieldset__body">
                                    <div class="field-row">
                                        <div class="field">
                                            <label class="field__label" for="lawsuit-subject-matter">Objeto/Assunto</label>
                                            <select class="select" id="lawsuit-subject-matter" name="subject_matter_id" required
                                                    data-form-subject-matter aria-describedby="erro-lawsuit-subject-matter">
                                                <option value="">Selecione</option>
                                            </select>
                                            <p class="field__error" id="erro-lawsuit-subject-matter"
                                               data-error-for="lawsuit-subject-matter" hidden></p>
                                        </div>

                                        <div class="field">
                                            <label class="field__label" for="lawsuit-proceeding-stage">Estágio processual</label>
                                            <select class="select" id="lawsuit-proceeding-stage" name="proceeding_stage_id" required
                                                    data-form-proceeding-stage aria-describedby="erro-lawsuit-proceeding-stage">
                                                <option value="">Selecione</option>
                                            </select>
                                            <p class="field__error" id="erro-lawsuit-proceeding-stage"
                                               data-error-for="lawsuit-proceeding-stage" hidden></p>
                                        </div>
                                    </div>

                                    <div class="field-row">
                                        <div class="field">
                                            <label class="field__label" for="lawsuit-status">Status</label>
                                            <select class="select" id="lawsuit-status" name="status_id" required
                                                    data-form-status aria-describedby="erro-lawsuit-status">
                                                <option value="">Selecione</option>
                                            </select>
                                            <p class="field__error" id="erro-lawsuit-status"
                                               data-error-for="lawsuit-status" hidden></p>
                                        </div>

                                        <div class="field">
                                            <label class="field__label" for="lawsuit-loss-probability">Probabilidade de perda</label>
                                            <select class="select" id="lawsuit-loss-probability" name="loss_probability_id" required
                                                    data-form-loss-probability aria-describedby="erro-lawsuit-loss-probability">
                                                <option value="">Selecione</option>
                                            </select>
                                            <p class="field__error" id="erro-lawsuit-loss-probability"
                                               data-error-for="lawsuit-loss-probability" hidden></p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Valor -------------------------------------- -->
                            <div class="fieldset" role="group" aria-labelledby="secao-valor">
                                <p class="fieldset__legend" id="secao-valor">Valor</p>
                                <div class="fieldset__body">
                                    <div class="field-row">
                                        <div class="field">
                                            <label class="field__label" for="lawsuit-claim-value">Valor da causa (R$)</label>
                                            <input class="input" type="number" id="lawsuit-claim-value"
                                                   name="claim_value" step="0.01" min="0" inputmode="decimal"
                                                   autocomplete="off" required
                                                   aria-describedby="erro-lawsuit-claim-value">
                                            <p class="field__error" id="erro-lawsuit-claim-value"
                                               data-error-for="lawsuit-claim-value" hidden></p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </fieldset>

                        <div class="card__footer">
                            <span class="spacer"></span>
                            <button type="button" class="btn btn--ghost" data-lawsuit-form-clear>Limpar</button>
                            <button type="submit" class="btn btn--primary" data-lawsuit-submit disabled>Cadastrar processo</button>
                        </div>
                    </div>
                </form>

            </div>
        </main>
    </div>
</div>

<!-- Shell (topbar, sidebar, menu da conta e usuário logado), comum a todas as
     telas. Vem antes do script da página, sempre. -->
<script type="module" src="/static/js/pages/shell.js"></script>
<script type="module" src="/static/js/pages/lancar_processo.js"></script>
</body>
</html>
